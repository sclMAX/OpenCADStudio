[package]
name = "plugin-template-v2"
version = "0.1.0"
edition = "2021"
description = "Example OpenCAD Studio plugin demonstrating the shared-memory DocumentReader API."
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ocs_plugin_api = { path = "../../crates/ocs_plugin_api", features = ["host"] }
# Must match the host's opencadcodec pin exactly (its Cargo.toml's `codec`
# entry): the plugin's entities and the host's re-exports are the same types
# only when both resolve the same revision. The registration `rustc` /
# `acadrust_source` gates enforce this at load time too.
acadrust = { package = "acadrust", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "e6c9982" }
